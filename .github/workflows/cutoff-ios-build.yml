# Builds the Cutoff iOS app (public repo rzhaosv/cutoff) on a free GitHub macOS runner via `eas build --local`.
# Lives in this repo so it can reuse the shared secrets (EXPO_TOKEN, ASC key, dist cert).
name: Cutoff iOS build (local EAS)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: cutoff git ref to build
        default: main
        required: true
      submit:
        description: Upload the IPA to App Store Connect after building
        type: boolean
        default: false

concurrency:
  group: cutoff-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rzhaosv/cutoff
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Write signing credentials
        env:
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          mkdir -p .credentials
          printf '%s' "${{ secrets.IOS_DIST_P12_B64 }}" | base64 --decode > .credentials/dist.p12
          printf '%s' "${{ secrets.CUTOFF_PROFILE_B64 }}" | base64 --decode > .credentials/cutoff.mobileprovision
          node -e '
            const fs = require("fs");
            fs.writeFileSync("credentials.json", JSON.stringify({ ios: {
              provisioningProfilePath: ".credentials/cutoff.mobileprovision",
              distributionCertificate: { path: ".credentials/dist.p12", password: process.env.P12_PASSWORD } } }, null, 2));
          '
      - name: Show toolchain
        run: |
          xcodebuild -version
          eas whoami
      - name: Build IPA locally
        run: |
          eas build --platform ios --profile production --local --non-interactive \
            --output "$GITHUB_WORKSPACE/cutoff-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: cutoff-ios-ipa
          path: cutoff-ios.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        # Direct altool upload with the ASC API key; `eas submit` on the free tier can sit IN_QUEUE for an hour+.
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "${{ secrets.ASC_API_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_638BMBPA45.p8
          xcrun altool --upload-app -f "$GITHUB_WORKSPACE/cutoff-ios.ipa" -t ios \
            --apiKey 638BMBPA45 --apiIssuer f6b1c22d-c20b-471b-9c5d-fb9619390dc8
