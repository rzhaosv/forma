# Builds the Nibble iOS app on a GitHub-hosted macOS runner using `eas build --local`.
# Local builds do not consume EAS cloud build quota. Signing credentials and
# EAS environment variables are fetched from Expo using the EXPO_TOKEN secret.
name: iOS build (local EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        default: production
        required: true
      submit:
        description: Submit the IPA to App Store Connect after building
        type: boolean
        default: false

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Show toolchain
        run: |
          xcodebuild -version
          fastlane --version | tail -1
          pod --version
          eas whoami

      - name: Build IPA locally
        run: |
          eas build --platform ios --profile "${{ inputs.profile }}" --local --non-interactive \
            --output "$GITHUB_WORKSPACE/nibble-ios.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: nibble-ios-ipa
          path: nibble-ios.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        run: |
          printf '%s\n' "${{ secrets.ASC_API_KEY_P8 }}" > "$RUNNER_TEMP/AuthKey.p8"
          # eas.json points ascApiKeyPath at a path on Ray's Mac; repoint it for this runner.
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            c.submit.production.ios.ascApiKeyPath = process.env.RUNNER_TEMP + "/AuthKey.p8";
            fs.writeFileSync("eas.json", JSON.stringify(c, null, 2));
          '
          eas submit --platform ios --profile production --non-interactive \
            --path "$GITHUB_WORKSPACE/nibble-ios.ipa"
